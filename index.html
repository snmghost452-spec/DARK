<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030508">
<title>DARK | Gaming Store</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#030406;
color:#fff;
overflow-x:hidden;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-5;
background:
linear-gradient(180deg,rgba(0,0,0,.45),#030406 85%),
url("1787436314905.png") center/cover no-repeat;
}

body:after{
content:"";
position:fixed;
inset:0;
z-index:-4;
background:
radial-gradient(circle at 20% 20%,rgba(0,145,255,.22),transparent 28%),
radial-gradient(circle at 80% 40%,rgba(0,255,140,.10),transparent 25%);
pointer-events:none;
}

a{
text-decoration:none;
color:inherit
}

button,input{
font:inherit
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
background:rgba(0,0,0,.68);
backdrop-filter:blur(18px);
border-bottom:1px solid rgba(0,170,255,.18);
}

.nav{
width:min(1200px,92%);
height:78px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo-img{
width:125px;
height:60px;
object-fit:contain;
filter:drop-shadow(0 0 12px #008cff);
}

nav{
display:flex;
gap:28px;
}

nav a{
font-size:12px;
font-weight:900;
letter-spacing:1px;
color:#b4becb;
}

nav a:hover{
color:#00b7ff;
text-shadow:0 0 15px #008cff;
}

.menu{
display:none;
background:none;
border:1px solid #123;
color:#fff;
padding:10px;
border-radius:10px;
}

/* HERO */

.hero{
min-height:100vh;
padding-top:78px;
display:flex;
align-items:center;
}

.hero-inner{
width:min(1200px,92%);
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.tag{
color:#00b7ff;
font-size:11px;
font-weight:900;
letter-spacing:3px;
margin-bottom:15px;
}

.hero h1{
font-size:clamp(55px,8vw,105px);
line-height:.85;
letter-spacing:-6px;
}

.hero h1 span{
color:#00aaff;
text-shadow:
0 0 15px #008cff,
0 0 50px rgba(0,140,255,.7);
}

.hero p{
max-width:560px;
margin:28px 0;
color:#a0adbb;
line-height:1.7;
font-size:16px;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.btn{
border:0;
border-radius:12px;
padding:15px 22px;
font-weight:900;
cursor:pointer;
transition:.25s;
}

.primary{
background:linear-gradient(135deg,#00aaff,#00e5ff);
color:#001018;
box-shadow:0 0 30px rgba(0,170,255,.3);
}

.primary:hover{
transform:translateY(-3px);
box-shadow:0 0 50px rgba(0,170,255,.6);
}

.secondary{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.15);
color:#fff;
}

/* HERO LOGO */

.hero-logo{
width:min(450px,90%);
display:block;
margin:auto;
filter:
drop-shadow(0 0 15px #008cff)
drop-shadow(0 0 45px rgba(0,120,255,.4));
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{
transform:translateY(0)
}
50%{
transform:translateY(-14px)
}
}

/* SECTIONS */

section{
padding:100px 0;
}

.wrap{
width:min(1200px,92%);
margin:auto;
}

h2{
font-size:clamp(34px,5vw,58px);
margin-bottom:10px;
}

.desc{
color:#8592a2;
line-height:1.6;
margin-bottom:35px;
}

/* GAMES */

.games{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:18px;
}

.game{
height:390px;
position:relative;
overflow:hidden;
border-radius:22px;
border:1px solid rgba(255,255,255,.1);
background:#080c11;
cursor:pointer;
transition:.35s;
}

.game:hover{
transform:translateY(-9px);
border-color:#00aaff;
box-shadow:
0 20px 60px rgba(0,0,0,.6),
0 0 30px rgba(0,170,255,.18);
}

.game img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.game:hover img{
transform:scale(1.08);
}

.game:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
transparent 25%,
rgba(0,0,0,.95)
);
}

.game-info{
position:absolute;
bottom:20px;
left:20px;
right:20px;
z-index:2;
}

.game-info small{
color:#00b7ff;
font-weight:900;
letter-spacing:2px;
}

.game-info h3{
font-size:25px;
margin:8px 0;
}

.game-info p{
color:#aab4c0;
}

/* DEALS */

.deals{
display:grid;
grid-template-columns:1.4fr .8fr;
gap:18px;
}

.deal{
padding:38px;
min-height:260px;
border-radius:25px;
border:1px solid rgba(0,170,255,.2);
background:rgba(7,12,18,.85);
}

.deal h3{
font-size:32px;
margin-bottom:14px;
}

.deal p{
color:#8492a2;
line-height:1.7;
margin-bottom:25px;
}

/* FEATURES */

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.feature{
padding:30px;
border-radius:20px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.08);
}

.feature span{
font-size:30px;
}

.feature h3{
margin:17px 0 9px;
}

.feature p{
color:#7e8b9b;
line-height:1.6;
}

/* PAYMENT */

.payment{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.payment-card{
padding:35px;
border-radius:25px;
background:rgba(7,12,18,.9);
border:1px solid rgba(0,170,255,.2);
}

.payment-card h3{
font-size:28px;
margin-bottom:20px;
}

.line{
display:flex;
justify-content:space-between;
gap:20px;
padding:15px 0;
border-bottom:1px solid rgba(255,255,255,.07);
}

.line span{
color:#8290a0;
}

/* CONTACT */

.contact{
text-align:center;
padding:70px 30px;
border-radius:30px;
background:
linear-gradient(rgba(3,7,12,.8),rgba(3,7,12,.9)),
url("1787436314905.png") center/cover;
border:1px solid rgba(0,170,255,.2);
}

.contact p{
color:#8794a4;
margin:15px 0 25px;
}

/* FOOTER */

footer{
padding:35px 0;
border-top:1px solid rgba(255,255,255,.08);
color:#667384;
}

.footer{
width:min(1200px,92%);
margin:auto;
display:flex;
justify-content:space-between;
}

/* PRODUCT POPUP */

.modal-bg{
position:fixed;
inset:0;
z-index:3000;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.82);
backdrop-filter:blur(12px);
}

.modal-bg.open{
display:flex;
}

.modal{
width:min(950px,100%);
max-height:90vh;
overflow:auto;
background:#080c11;
border:1px solid rgba(0,170,255,.3);
border-radius:25px;
box-shadow:0 30px 100px #000;
}

.modal-grid{
display:grid;
grid-template-columns:.9fr 1.1fr;
}

.modal-image{
min-height:480px;
}

.modal-image img{
width:100%;
height:100%;
object-fit:cover;
}

.modal-content{
padding:35px;
}

.close{
float:right;
background:none;
border:0;
color:#fff;
font-size:28px;
cursor:pointer;
}

.modal-content h2{
margin:15px 0;
}

.package{
width:100%;
display:flex;
justify-content:space-between;
padding:15px;
margin:8px 0;
border-radius:12px;
border:1px solid rgba(255,255,255,.08);
background:#0d131b;
color:#fff;
cursor:pointer;
}

.package:hover,
.package.selected{
border-color:#00aaff;
background:rgba(0,170,255,.1);
}

.field{
width:100%;
padding:15px;
margin:15px 0;
border-radius:11px;
border:1px solid rgba(255,255,255,.1);
background:#030609;
color:#fff;
outline:none;
}

.field:focus{
border-color:#00aaff;
}

.receipt-box{
margin-top:20px;
padding:20px;
border-radius:16px;
background:rgba(0,170,255,.04);
border:1px solid rgba(0,170,255,.15);
}

.receipt-title{
color:#00b7ff;
font-weight:900;
font-size:13px;
letter-spacing:1px;
margin-bottom:10px;
}

.scan-status{
color:#7e8b9b;
font-size:13px;
line-height:1.5;
margin-top:5px;
}

.transaction-box{
display:none;
}

.transaction-box.show{
display:block;
}

.warning{
font-size:11px;
color:#8c98a7;
line-height:1.5;
margin-top:5px;
}

.loading{
display:inline-block;
width:12px;
height:12px;
border:2px solid rgba(255,255,255,.2);
border-top-color:#00b7ff;
border-radius:50%;
animation:spin .8s linear infinite;
margin-right:6px;
vertical-align:-2px;
}

@keyframes spin{
to{
transform:rotate(360deg)
}
}

/* MOBILE */

@media(max-width:950px){

.hero-inner{
grid-template-columns:1fr;
text-align:center;
}

.hero p{
margin-left:auto;
margin-right:auto;
}

.actions{
justify-content:center;
}

.games{
grid-template-columns:repeat(2,1fr);
}

.payment,
.deals{
grid-template-columns:1fr;
}

}

@media(max-width:700px){

nav{
display:none;
position:absolute;
top:78px;
left:0;
right:0;
background:#030609;
padding:25px;
flex-direction:column;
}

nav.open{
display:flex;
}

.menu{
display:block;
}

.hero{
min-height:auto;
padding-top:130px;
padding-bottom:70px;
}

.hero-logo{
max-width:330px;
}

.games,
.features{
grid-template-columns:1fr;
}

.game{
height:430px;
}

.modal-grid{
grid-template-columns:1fr;
}

.modal-image{
height:280px;
min-height:0;
}

.footer{
flex-direction:column;
gap:10px;
}

.modal-content{
padding:25px;
}

}

/* FILE INPUT */

input[type="file"]{
cursor:pointer;
}

input[type="file"]::file-selector-button{
background:#00aaff;
border:0;
padding:10px 14px;
border-radius:8px;
font-weight:900;
margin-right:10px;
cursor:pointer;
}
</style>
</head>

<body>

<header>

<div class="nav">

<a href="#home">

<img
class="logo-img"
src="1787436309105.png"
alt="DARK Logo">

</a>

<nav id="nav">

<a href="#home">HOME</a>
<a href="#games">GAMING</a>
<a href="#deals">DEALS</a>
<a href="#payment">PAYMENT</a>
<a href="#contact">CONTACT</a>

</nav>

<button
class="menu"
onclick="document.getElementById('nav').classList.toggle('open')">

☰

</button>

</div>

</header>


<!-- HERO -->

<section class="hero" id="home">

<div class="hero-inner">

<div>

<div class="tag">
DARK DIGITAL GAMING
</div>

<h1>
LEVEL UP<br>
YOUR <span>GAME.</span>
</h1>

<p>
Gaming top-ups, digital products and exclusive deals.
Choose your game, choose your package and order directly
through DARK.
</p>

<div class="actions">

<a href="#games" class="btn primary">
EXPLORE GAMING →
</a>

<a href="#contact" class="btn secondary">
CONTACT DARK
</a>

</div>

</div>

<div>

<img
class="hero-logo"
src="1787436309105.png"
alt="DARK">

</div>

</div>

</section
